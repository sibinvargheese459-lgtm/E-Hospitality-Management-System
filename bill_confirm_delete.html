{% extends 'base.html' %}
{% block title %}Delete Bill{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:520px;">
  <p>Are you sure you want to delete Bill #{{ object.pk }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'billing:list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
