{% extends 'base.html' %}
{% block title %}Login - MediCare HMS{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="fa-solid fa-house-medical fa-2x" style="color:#0f766e"></i>
      <h4 class="mt-2 mb-0">MediCare HMS</h4>
      <p class="text-muted small">Sign in to your account</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-brand w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0 small">No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
