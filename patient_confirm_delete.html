{% extends 'base.html' %}
{% block title %}Delete Patient{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:520px;">
  <p>Are you sure you want to delete <strong>{{ object.full_name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'patients:list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
